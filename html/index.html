<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XS-Mechanic</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="hud" hidden>
  <div class="hh">
    <span class="t" data-hud-shop>Mechanic</span>
    <span class="p" data-hud-plate></span>
  </div>
  <div class="hb" data-hud-body></div>
</div>

<div id="root">
  <!-- Catches a drag to turn the car. Only in the sheet layout, where the car
       is the whole screen and the panel is a sidebar over it. -->
  <div class="stage" data-stage hidden>
    <div class="hint">Drag to turn the car</div>
  </div>

  <div class="device" data-device="tablet">
    <i class="skin cut"></i>
    <span class="led" data-led></span>
    <span class="port"></span>

    <div class="frame">

      <div class="bar">
        <button class="back" data-back hidden title="Home">
          <svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg>
        </button>

        <div class="logo">
          <i>M</i>
          <div>
            <div class="t" data-title>Mechanic</div>
            <div class="s" data-shop-name>No shop</div>
          </div>
        </div>

        <div class="sp"></div>

        <span class="link" data-link hidden></span>

        <div class="who">
          <i data-duty></i>
          <span data-who>—</span>
        </div>

        <button class="xbtn" data-close title="Close">
          <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="split" data-split>
        <aside class="subject" data-subject></aside>

        <div class="work" data-work>
          <section class="panel" data-panel="apps"></section>
          <section class="panel" data-panel="vehicle"></section>
          <section class="panel" data-panel="tuning"></section>
          <section class="panel" data-panel="repairs"></section>
          <section class="panel" data-panel="service"></section>
          <section class="panel" data-panel="performance"></section>
          <section class="panel" data-panel="stance"></section>
          <section class="panel" data-panel="dyno"></section>
          <section class="panel" data-panel="invoices"></section>
          <section class="panel" data-panel="orders"></section>
          <section class="panel" data-panel="craft"></section>
          <section class="panel" data-panel="home"></section>
          <section class="panel" data-panel="team"></section>
          <section class="panel" data-panel="settings"></section>
          <section class="panel" data-panel="builder"></section>
        </div>
      </div>

      <!-- The dock. A tablet gets you home with a button, the way a tablet
           does, rather than a row of tabs across the top. -->
      <div class="dock" data-dock>
        <button class="dk" data-dock-home>
          <svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7"/><path d="M6.5 10v9h11v-9"/></svg>
          Home
        </button>
        <span class="dk state" data-dock-duty>On duty</span>
        <div class="sp"></div>
        <button class="dk" data-dock-drop hidden>
          <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
          Disconnect
        </button>
        <button class="dk" data-dock-close>
          <svg viewBox="0 0 24 24"><path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"/><path d="M15 8l4 4-4 4M19 12H9"/></svg>
          Close
        </button>
      </div>

    </div>
  </div>
</div>

<div id="toasts"></div>
<div id="modal" hidden></div>

<script src="js/mock.js"></script>
<script src="js/core.js"></script>
<script src="js/subject.js"></script>
<script src="js/panels/apps.js"></script>
<script src="js/panels/vehicle.js"></script>
<script src="js/panels/tuning.js"></script>
<script src="js/panels/repairs.js"></script>
<script src="js/panels/service.js"></script>
<script src="js/panels/performance.js"></script>
<script src="js/panels/stance.js"></script>
<script src="js/panels/dyno.js"></script>
<script src="js/panels/invoices.js"></script>
<script src="js/panels/orders.js"></script>
<script src="js/panels/craft.js"></script>
<script src="js/panels/home.js"></script>
<script src="js/panels/team.js"></script>
<script src="js/panels/settings.js"></script>
<script src="js/panels/builder.js"></script>
<script src="js/hud.js"></script>
<script src="js/app.js"></script>
</body>
</html>
